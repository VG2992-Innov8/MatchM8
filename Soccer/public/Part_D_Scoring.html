<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scoring — MatchM8</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    /* Details UI (lightweight, no deps) */
    .mm8-btn{padding:.25rem .5rem;border:1px solid #ddd;border-radius:.5rem;background:#f7f7f7;cursor:pointer}
    .mm8-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:9999}
    .mm8-modal{background:#fff;max-width:900px;width:90%;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:hidden}
    .mm8-modal-header{display:flex;justify-content:space-between;gap:1rem;padding:.75rem 1rem;border-bottom:1px solid #eee}
    .mm8-modal-body{padding:1rem;display:flex;flex-direction:column;gap:.75rem;max-height:70vh;overflow:auto}
    .mm8-row{display:grid;grid-template-columns:1.3fr .9fr .9fr .7fr 1fr;gap:.5rem;align-items:center;padding:.5rem;border:1px solid #f0f0f0;border-radius:.75rem}
    .mm8-points span{margin-right:.5rem;font-size:.85rem;padding:.1rem .35rem;border-radius:.5rem;border:1px solid #ddd}
    .mm8-points span.ok{background:#e9f8ee;border-color:#b7e2c3}
    .mm8-points span.no{background:#fbeaea;border-color:#f1c1c1}
    .mm8-points b{margin-left:.5rem}
  </style>
</head>

<body>
  <div id="hero" data-page="Scoring"></div>
  <script src="/hero.js" defer></script>

  <!-- Identity header (player name + tenant picker) -->
  <script src="/js/mm8-ident.js"></script>
  <div id="mm8-ident"></div>
  <script>MM8 && MM8.ident && MM8.ident.mount('#mm8-ident');</script>

  <main class="container wide">
    <div class="panel">
      <div class="center" style="gap:8px; flex-wrap:wrap;">
        <input id="week" class="input" type="number" min="1" value="1" style="max-width:120px">
        <button id="btnPreview" class="btn">Preview</button>
        <button id="btnCompute" class="btn primary">Calculate &amp; Save</button>
        <button id="btnSeason" class="btn">Season Leaderboard</button>
      </div>
      <div id="banner" class="banner ok" style="display:none;margin-top:10px"></div>
      <div id="err" class="banner error" style="display:none;margin-top:10px"></div>
    </div>

    <div class="panel">
      <table class="table" id="tbl">
        <thead>
          <tr>
            <th>Player</th>
            <th>Week Points</th>
            <th>Season Total</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="empty" style="padding:8px;color:var(--muted);display:none">No scores yet.</div>
    </div>
  </main>

  <script>
  /* ---------------- scope helpers (tenant + competition) ---------------- */
  const PAGE_QS = new URLSearchParams(location.search);
  const TENANT = PAGE_QS.get('t') || localStorage.getItem('tenant') || '';
  const COMP   = (PAGE_QS.get('c') || localStorage.getItem('comp') || '').trim();
  if (TENANT) { try { localStorage.setItem('tenant', TENANT); } catch {} }
  if (COMP)   { try { localStorage.setItem('comp', COMP); } catch {} }

  function withScope(url) {
    const u = new URL(url, location.origin);
    if (TENANT) u.searchParams.set('t', TENANT);
    if (COMP)   u.searchParams.set('c', COMP);
    return u.toString();
  }

  function navWithScope(path) { return withScope(path); }

  /* ---------------- page logic ---------------- */
  const $ = s => document.querySelector(s);
  const qs = new URLSearchParams(location.search);
  const weekInput = $('#week');
  const banner = $('#banner');
  const err = $('#err');
  const tbody = $('#tbl tbody');
  const empty = $('#empty');

  let TOTAL_WEEKS = 38;

  function ok(msg){
    banner.textContent = msg || 'Done';
    banner.style.display = 'block';
    err.style.display = 'none';
    setTimeout(()=> banner.style.display='none', 1800);
  }
  function oops(msg){
    err.textContent = msg || 'Something went wrong';
    err.style.display = 'block';
    banner.style.display = 'none';
  }
  function clampWeek(){
    let w = Number(weekInput.value) || 1;
    if (w < 1) w = 1;
    if (w > TOTAL_WEEKS) w = TOTAL_WEEKS;
    weekInput.value = w;
    return w;
  }

  async function loadConfig(){
    try{
      const cfg = await fetch(withScope('/api/config'), { cache:'no-store' }).then(r=>r.json());
      TOTAL_WEEKS = Number(cfg.total_weeks) || 38;
      const urlW = Number(qs.get('week'));
      const startW = Number.isFinite(urlW) ? urlW : (Number(cfg.current_week) || 1);
      weekInput.value = startW;
      clampWeek();
    }catch{
      // defaults
    }
  }

  /* ---------- Normalisers ---------- */

  function rowsFromSummary(payload){
    if (!payload) return [];
    const weekly = Array.isArray(payload.weekly) ? payload.weekly : [];
    const totalsArr = Array.isArray(payload.seasonTotals) ? payload.seasonTotals : [];
    const totalsMap = new Map(
      totalsArr.map(t => [String(t.player_id), Number(t.totalPoints ?? t.total ?? 0)])
    );
    return weekly.map(r => ({
      id: String(r.player_id ?? r.id ?? r.player ?? r.name ?? ''),
      name: (r.player ?? r.name ?? r.player_name ?? '').trim(),
      week: Number(r.weekPoints ?? r.week_points ?? r.week ?? 0),
      total: totalsMap.get(String(r.player_id)) ?? Number(r.seasonTotal ?? r.total ?? r.weekPoints ?? 0)
    }));
  }

  function normaliseScores(payload){
    if (!payload) return [];
    if (Array.isArray(payload.weekly)) {
      return payload.weekly.map(r => ({
        id: String(r.player_id ?? r.id ?? r.player ?? r.name ?? ''),
        name: r.player || r.name || r.player_name || '',
        week: Number(r.weekPoints ?? r.week_points ?? r.week ?? 0),
        total: Number(r.seasonTotal ?? r.total ?? 0),
      }));
    }
    if (Array.isArray(payload)) {
      return payload.map(r => ({
        id: String(r.player_id ?? r.id ?? r.player ?? r.name ?? ''),
        name: r.name || r.player || r.player_name || '',
        week: Number(r.week_points ?? r.week ?? r.points ?? 0),
        total: Number(r.season_total ?? r.total ?? r.cumulative ?? r.sum ?? (r.week_points ?? 0)),
      }));
    }
    const rows = payload.table || payload.rows || payload.scores || payload.leaderboard || payload.players || [];
    return Array.isArray(rows) ? normaliseScores(rows) : [];
  }

  /* ---------- Details breakdown helpers ---------- */

  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  function fmtLine(lines){
    if(!lines) return '';
    const s = Number.isFinite(lines.spread_line) ? `Spread: ${lines.spread_line}` : '';
    const t = Number.isFinite(lines.total_line)  ? `Total: ${lines.total_line}`   : '';
    return [s,t].filter(Boolean).join(' • ');
  }
  function fmtRes(r){ return r.result ? `Final: ${r.result.home}-${r.result.away}` : '<em>Pending</em>'; }
  function inferSpreadPick(r){
    if (!r.lines || !Number.isFinite(r.lines.spread_line)) return null;
    if (!r.prediction || !Number.isInteger(r.prediction.exact_home) || !Number.isInteger(r.prediction.exact_away)) return null;
    const m = (r.prediction.exact_home + r.lines.spread_line) - r.prediction.exact_away;
    return m>0?'HOME':m<0?'AWAY':null;
  }
  function inferTotalPick(r){
    if (!r.lines || !Number.isFinite(r.lines.total_line)) return null;
    if (!r.prediction || !Number.isInteger(r.prediction.exact_home) || !Number.isInteger(r.prediction.exact_away)) return null;
    const sum = r.prediction.exact_home + r.prediction.exact_away;
    return sum>r.lines.total_line?'OVER':sum<r.lines.total_line?'UNDER':null;
  }
  function fmtPred(r, spreadPick, totalPick){
    if (!r.prediction) return '<em>(no prediction)</em>';
    const parts=[];
    if (Number.isInteger(r.prediction.exact_home) && Number.isInteger(r.prediction.exact_away))
      parts.push(`Pred: ${r.prediction.exact_home}-${r.prediction.exact_away}`);
    if (r.prediction.winner) parts.push(`Winner: ${r.prediction.winner}`);
    if (spreadPick) parts.push(`ATS: ${spreadPick}`);
    if (totalPick)  parts.push(`O/U: ${totalPick}`);
    return parts.join(' • ');
  }

  function computeBreakdown(r){
    const fx = r.lines || {};
    const res = r.result || null;
    const pred = r.prediction || {};

    const out = { winner:0, ats:0, ou:0, exact:0 };
    if (!res) return out; // no result yet

    // Winner (+2)
    let winnerPick = pred.winner;
    if (!winnerPick && Number.isInteger(pred.exact_home) && Number.isInteger(pred.exact_away)) {
      if (pred.exact_home !== pred.exact_away) {
        winnerPick = pred.exact_home > pred.exact_away ? 'HOME' : 'AWAY';
      }
    }
    const homeWon = res.home > res.away;
    const winnerHit = winnerPick && ((winnerPick === 'HOME' && homeWon) || (winnerPick === 'AWAY' && !homeWon));
    if (winnerHit) out.winner = 2;

    // ATS (+1) — infer pick from numeric prediction if absent
    let spreadPick = pred.spread_pick;
    if (!spreadPick && typeof fx.spread_line === 'number' &&
        Number.isInteger(pred.exact_home) && Number.isInteger(pred.exact_away)) {
      const pm = (pred.exact_home + fx.spread_line) - pred.exact_away;
      spreadPick = pm > 0 ? 'HOME' : pm < 0 ? 'AWAY' : null;
    }
    if (typeof fx.spread_line === 'number' && spreadPick) {
      const m = (res.home + fx.spread_line) - res.away;
      const homeCovers = m > 0; // push ignored
      const atsHit = (homeCovers && spreadPick === 'HOME') || (!homeCovers && spreadPick === 'AWAY');
      if (atsHit) out.ats = 1;
    }

    // O/U (+1) — infer pick from numeric prediction if absent
    let totalPick = pred.total_pick;
    if (!totalPick && typeof fx.total_line === 'number' &&
        Number.isInteger(pred.exact_home) && Number.isInteger(pred.exact_away)) {
      const psum = pred.exact_home + pred.exact_away;
      totalPick = psum > fx.total_line ? 'OVER' : psum < fx.total_line ? 'UNDER' : null;
    }
    if (typeof fx.total_line === 'number' && totalPick) {
      const sum = res.home + res.away;
      const over = sum > fx.total_line; // push ignored
      const ouHit = (over && totalPick === 'OVER') || (!over && totalPick === 'UNDER');
      if (ouHit) out.ou = 1;
    }

    // Exact (+2)
    const gaveExact = Number.isInteger(pred.exact_home) && Number.isInteger(pred.exact_away);
    if (gaveExact && pred.exact_home === res.home && pred.exact_away === res.away) out.exact = 2;

    return out;
  }

  function renderBreakdownRow(r){
    const spreadPick = r.prediction?.spread_pick ?? inferSpreadPick(r);
    const totalPick  = r.prediction?.total_pick  ?? inferTotalPick(r);

    const b = computeBreakdown(r);

    return `
      <div class="mm8-row">
        <div class="mm8-match"><strong>${esc(r.homeTeam)}</strong> vs <strong>${esc(r.awayTeam)}</strong></div>
        <div class="mm8-lines">${fmtLine(r.lines)}</div>
        <div class="mm8-pred">${fmtPred(r, spreadPick, totalPick)}</div>
        <div class="mm8-res">${fmtRes(r)}</div>
        <div class="mm8-points">
          <span class="${b.winner?'ok':'no'}">Winner${b.winner?'+2':''}</span>
          ${spreadPick?`<span class="${b.ats?'ok':'no'}">ATS${b.ats?'+1':''}</span>`:''}
          ${totalPick?`<span class="${b.ou?'ok':'no'}">O/U${b.ou?'+1':''}</span>`:''}
          <span class="${b.exact?'ok':'no'}">Exact${b.exact?'+2':''}</span>
          <b>${(r.points ?? (b.winner+b.ats+b.ou+b.exact))} pts</b>
        </div>
      </div>`;
  }

  async function openDetailsModalByName(playerName, week){
    const url = new URL('/api/scores/player-week', location.origin);
    url.searchParams.set('week', String(week));
    url.searchParams.set('name', playerName);
    if (TENANT) url.searchParams.set('t', TENANT);
    if (COMP)   url.searchParams.set('c', COMP);

    const res = await fetch(url.toString(), { cache:'no-store' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'failed');

    const rows = data.rows || [];
    const overlay = document.createElement('div');
    overlay.className = 'mm8-overlay';
    overlay.innerHTML = `
      <div class="mm8-modal">
        <div class="mm8-modal-header">
          <strong>${esc(data.player?.name || playerName)}</strong> — Week ${data.week} • ${data.totals?.weekPoints ?? 0} pts
          <button class="mm8-close" aria-label="Close">×</button>
        </div>
        <div class="mm8-modal-body">
          ${rows.map(renderBreakdownRow).join('')}
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('.mm8-close').onclick = () => overlay.remove();
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  }

  /* ---------- Render table ---------- */

  function renderRows(rows){
    tbody.innerHTML = '';
    if (!rows.length) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    rows.forEach(r=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${esc(r.name ?? '')}</td>
        <td class="right">${Number.isFinite(+r.week) ? +r.week : ''}</td>
        <td class="right">${Number.isFinite(+r.total) ? +r.total : ''}</td>
        <td class="right"><button class="mm8-btn">Details ▸</button></td>`;
      const btn = tr.querySelector('button.mm8-btn');
      btn.addEventListener('click', async () => {
        try {
          await openDetailsModalByName(r.name, clampWeek());
        } catch (e) {
          alert('Failed to load breakdown');
        }
      });
      tbody.appendChild(tr);
    });
  }

  /* ---------- Preview using /summary (cumulative totals) ---------- */
  async function preview(){
    try{
      const w = clampWeek();

      // Prefer the summary join (cumulative)
      let rows = [];
      try{
        const r1 = await fetch(withScope(`/api/scores/summary?week=${encodeURIComponent(w)}`), { cache:'no-store' });
        if (r1.ok) {
          const data1 = await r1.json().catch(()=> ({}));
          rows = rowsFromSummary(data1);
        }
      }catch{ /* ignore; will fall back */ }

      // Fallback to legacy preview if needed
      if (!rows.length) {
        const r2 = await fetch(withScope(`/api/scores?week=${encodeURIComponent(w)}`), { cache:'no-store' });
        if (!r2.ok) throw new Error(`${r2.status} ${r2.statusText}`);
        const data2 = await r2.json().catch(()=> ({}));
        rows = normaliseScores(data2);
      }

      renderRows(rows);
      if (!rows.length) {
        empty.innerHTML = 'No scores yet. Has the admin entered results and computed this week?';
      }
    }catch(e){
      oops('Could not load scores: ' + e.message);
    }
  }

  /* ---------- Compute, then refresh preview ---------- */
  async function compute(){
    try{
      const w = clampWeek();

      // Try POST with query param, then fallback GET, then POST with JSON body
      let resp = await fetch(withScope(`/api/scores/compute?week=${encodeURIComponent(w)}`), { method:'POST' })
                  .catch(()=>null);
      if (!resp || !resp.ok) {
        resp = await fetch(withScope(`/api/scores/compute?week=${encodeURIComponent(w)}`)).catch(()=>null);
      }
      if (!resp || !resp.ok) {
        resp = await fetch(withScope('/api/scores/compute'), {
          method:'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ week: w })
        }).catch(()=>null);
      }
      if (!resp || !resp.ok) throw new Error(resp ? `${resp.status} ${resp.statusText}` : 'network');

      ok(`✅ Scores computed for week ${w}`);
      await preview();
    }catch(e){
      oops('Compute failed: ' + e.message);
    }
  }

  // Wire-up
  $('#btnPreview').addEventListener('click', preview);
  $('#btnCompute').addEventListener('click', compute);
  $('#btnSeason').addEventListener('click', ()=> location.href = navWithScope('/Part_E_Season.html'));
  weekInput.addEventListener('change', ()=> { clampWeek(); preview(); });

  (async function init(){
    await loadConfig();
    await preview();
  })();
  </script>

  <script src="/js/tenant.js"></script>
</body>
</html>
